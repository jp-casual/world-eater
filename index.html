<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>World Eater</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background-color: #1a1a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
    }
    
    header {
      text-align: center;
      padding: 20px;
      background-color: #0a0a0a;
      border-bottom: 2px solid #333;
    }
    
    header h1 {
      margin: 0;
      font-size: 2.5rem;
      font-weight: 700;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }
    
    main {
      flex: 1;
      display: flex;
      gap: 20px;
      padding: 20px;
      align-items: center;
      justify-content: center;
    }
    
    .sidebar {
      min-width: 200px;
      max-width: 250px;
      background-color: #0f0f0f;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 15px;
      /* Reserved for future content */
    }
    
    .sidebar h3 {
      margin-top: 0;
      font-size: 1rem;
      color: #888;
    }
    
    #game-container {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
      background-color: #0f0f0f;
      border: 2px solid #444;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }
    
    #game {
      display: block;
    }
    
    /* Responsive: hide sidebars on smaller screens */
    @media (max-width: 1400px) {
      .sidebar {
        display: none;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>World Eater</h1>
  </header>
  
  <main>
    <aside class="sidebar">
      <h3>Left Panel</h3>
      <!-- Reserved for future content -->
    </aside>
    
    <div id="game-container">
      <div id="game"></div>
    </div>
    
    <aside class="sidebar">
      <h3>Right Panel</h3>
      <!-- Reserved for future content -->
    </aside>
  </main>
  
  <script type="module" src="/src/main.js"></script>
</body>
</html>
